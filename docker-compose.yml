services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: walletbot
      POSTGRES_USER: walletbot
      POSTGRES_PASSWORD: walletbot
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletbot -d walletbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: runner
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: sh -c "pnpm db:deploy && pnpm start"

  worker:
    build:
      context: .
      target: runner
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm db:deploy && pnpm worker"

volumes:
  postgres-data:
